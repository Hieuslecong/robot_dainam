[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "robot-ai-host"
version = "0.1.0"
description = "Robot AI Host Server - intermediate voice conversation host using Pipecat v1.6.0"
requires-python = ">=3.11,<3.13"
dependencies = [
    "uvloop>=0.19",
    "pipecat-ai[webrtc,google,silero]==1.6.0",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "pydantic>=2.0,<3",
    "pydantic-settings>=2.0,<3",
    "structlog>=24.0,<25",
    "python-dotenv>=1.0,<2",
    "PyJWT>=2.8,<3",
    "httpx>=0.27,<1",
    "pyyaml>=6.0,<7",
    "python-multipart>=0.0.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "coverage>=7.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["app"]
