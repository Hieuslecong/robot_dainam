services:
  piper:
    build:
      context: .
      dockerfile: docker/piper/Dockerfile
    environment:
      PIPER_VOICE: ${PIPER_VOICE:-vi_VN-vais1000-medium}
      PIPER_DATA_DIR: /models
    volumes:
      - piper_models:/models
    restart: unless-stopped

  robot-ai-host:
    build:
      context: .
      dockerfile: Dockerfile.hybrid
    depends_on:
      - piper
    env_file:
      - .env
    environment:
      DEFAULT_PROFILE: hybrid_local_vi
      LOCAL_STT_BACKEND: faster-whisper
      PIPER_BASE_URL: http://piper:5000
      WHISPER_DEVICE: cpu
      WHISPER_COMPUTE_TYPE: int8
    ports:
      - "8000:8000"
    volumes:
      - ./artifacts:/app/artifacts
      - whisper_models:/root/.cache/huggingface
    restart: unless-stopped

volumes:
  piper_models:
  whisper_models:
